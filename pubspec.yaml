name: edusense_ai
description: "A new Flutter project."
# Prevent the package from being accidentally published to pub.dev
publish_to: 'none'  # Remove this line if you wish to publish to pub.dev

# Version and build number for your application
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Time Management
  timeago: ^3.0.0

  # UI Enhancements
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.7
  lottie: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.71.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.2.3

  # State Management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0

  # Dependency Injection
  get_it: ^8.0.3

  # Routing
  auto_route: ^9.3.0+1

  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  connectivity_plus: ^6.1.4

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  equatable: ^2.0.5
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.0.1
  url_launcher: ^6.1.12
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0
  permission_handler: ^12.0.0+1

  # File Handling
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  open_file: ^3.0.1
  pdf: ^3.8.0

  # Voice & Audio
  just_audio: ^0.10.1
  record: ^6.0.0
  speech_to_text: ^7.0.0

  # Visualization
  graphview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mockito: ^5.4.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.0

  # Code Generation
  build_runner: ^2.4.6
  auto_route_generator: ^9.0.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # Fonts (uncomment and edit this section if needed)
